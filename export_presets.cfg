[preset.0]

name="Windows Offline"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; ============================================================================
; PASSO 24.2 — LIMPEZA DE RECURSOS
; ============================================================================
; include_filter: arquivos NÃO-resource carregados via FileAccess em runtime
;   - assets/text/credits.txt (tela de Créditos — Passo 22)
;   - data/dialogs.json       (diálogos ramificados dos NPCs)
; exclude_filter: tudo que NÃO vai para o pacote final
;   - *.md             → README, RELEASE e documentação
;   - docs/*           → documentação de design
;   - build/*, dist/*  → saídas de build anteriores
;   - scripts/debug/*  → Dev Menu de QA (Passo 23) removido do lançamento
;   - tmp_validate*.ps1→ script local de validação headless
; Os .txt de design na raiz não precisam de filtro: com export_filter=
; "all_resources", arquivos não-resource só entram se casarem include_filter.
; ============================================================================
include_filter="assets/text/*.txt, data/*.json"
exclude_filter="*.md, docs/*, build/*, dist/*, scripts/debug/*, tmp_validate*.ps1"
export_path="build/ARCANJO_CAIDO.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
;; Passo 24.3: release sem wrapper de console (jogador final não precisa);
;; para depurar a build, gere uma exportação debug à parte.
debug/export_console_wrapper=0
;; .pck embutido no .exe = arquivo único, pronto para Itch.io/Steam.
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
;; ============================================================================
;; PASSO 24.1 — ÍCONE E METADADOS DO EXECUTÁVEL (v1.0.0)
;; ============================================================================
application/icon="res://icon.svg"
application/file_version="1.0.0.0"
application/product_version="1.0.0-beta-final"
application/company_name="Equipe Arcanjo Caido"
application/product_name="Arcanjos Caídos Beta Final"
application/file_description="Metroidvania offline protagonizado por Lucifer em Aeterna"
application/copyright="© 2026 Equipe Arcanjo Caido"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true

