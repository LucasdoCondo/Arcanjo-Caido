include_filter="assets/text/*.txt, data/*.json"
exclude_filter="*.md, docs/*, build/*, dist/*, scripts/debug/*, tmp_validate*.ps1"
export_path="C:/Lucifer_Game_Build/Lucifer.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

