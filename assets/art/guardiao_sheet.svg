<svg xmlns="http://www.w3.org/2000/svg" width="256" height="96" viewBox="0 0 256 96">
<!-- ARCANJO CAIDO - Guardião Caído: sheet 4 frames (64x96 cada)
     0-1: patrulha | 2: telegraph/ataque | 3: ferido -->
<defs>
  <g id="ghead">
    <rect x="26" y="6" width="12" height="12" fill="#22242e" stroke="#4a4a5a" stroke-width="1.5"/>
    <rect x="28" y="10" width="2.5" height="2.5" fill="#88aaff"/>
    <rect x="34" y="10" width="2.5" height="2.5" fill="#88aaff"/>
  </g>
  <g id="gtorso">
    <rect x="20" y="20" width="24" height="30" fill="#22242e" stroke="#4a4a5a" stroke-width="1.5"/>
    <rect x="14" y="16" width="8" height="24" fill="#2c2f3c"/>
    <rect x="42" y="16" width="8" height="24" fill="#2c2f3c"/>
  </g>
</defs>

<!-- FRAME 0: patrol A -->
<g transform="translate(0,0)">
  <use href="#ghead"/><use href="#gtorso"/>
  <rect x="22" y="50" width="7" height="40" fill="#191b23"/>
  <rect x="35" y="50" width="7" height="40" fill="#191b23"/>
</g>

<!-- FRAME 1: patrol B -->
<g transform="translate(64,0)">
  <g transform="translate(0,-2)">
    <use href="#ghead"/><use href="#gtorso"/>
    <rect x="22" y="50" width="7" height="40" fill="#191b23"/>
    <rect x="35" y="50" width="7" height="40" fill="#191b23"/>
  </g>
</g>

<!-- FRAME 2: attack (braço erguido) -->
<g transform="translate(128,0)">
  <use href="#ghead"/><use href="#gtorso"/>
  <rect x="48" y="8" width="8" height="26" fill="#2c2f3c"/>
  <rect x="22" y="50" width="7" height="40" fill="#191b23"/>
  <rect x="35" y="50" width="7" height="40" fill="#191b23"/>
</g>

<!-- FRAME 3: hurt -->
<g transform="translate(192,0)">
  <g transform="translate(0,4)">
    <use href="#ghead"/><use href="#gtorso"/>
    <rect x="22" y="50" width="7" height="36" fill="#191b23"/>
    <rect x="35" y="50" width="7" height="36" fill="#191b23"/>
  </g>
</g>
</svg>
